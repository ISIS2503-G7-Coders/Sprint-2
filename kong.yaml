_format_version: "2.1"

services:

  - name: invoices_service
    host: invoices_upstream
    protocol: http
    routes:
      - name: invoices
        paths:
          - /invoices
        strip_path: false

  - name: facturas_service
    host: facturas_uptream
    protocol: http
    routes:
      - name: facturas
        paths:
          - /facturas
        strip_path: false

upstreams:

  - name: invoices_upstream
    targets:
    - target: 10.128.0.87:8080
      weight: 100

  - name: facturas_upstream
    targets:
    - target: 10.128.0.89:8080
      weight: 100