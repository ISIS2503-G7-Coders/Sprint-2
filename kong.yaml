_format_version: "2.1"

services:
  - name: invoices_service
    host: invoices1_uptream
    protocol: http
    routes:
      - name: invoices1
        paths:
          - /invoices1
        strip_path: false

  - name: invoices2_service
    host: invoices2_upstream
    protocol: http
    routes:
      - name: invoices2
        paths:
          - /invoices2
        strip_path: false

upstreams:
  - name: invoices_upstream
    targets:
      - target: 10.128.0.87:8080
        weight: 100
      
  - name: invoices2_upstream
    targets:
    - target: 10.128.0.89:8080
      weight: 100